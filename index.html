<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법정 시연</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: #111; color: #eee; font-family: sans-serif;
         display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  /* Nav bar below the stage (outside the courtroom): ◀ ▶ drawn as CSS triangles */
  #bar { height: 40px; flex: none; display: flex; gap: 10px; align-items: center; }
  .nav { width: 34px; height: 26px; border: 0; border-radius: 6px; background: rgba(255,255,255,.22); cursor: pointer; }
  .nav::before { content: ''; display: block; width: 10px; height: 12px; margin: auto; background: #fff; }
  #prev::before { clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  #next::before { clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .nav:hover:not(:disabled) { background: rgba(255,255,255,.4); }
  .nav:disabled { opacity: .3; cursor: default; }
  #stage { position: relative; overflow: hidden; container-type: inline-size;
           width: min(100vw, calc((100vh - 40px) * var(--ar))); aspect-ratio: var(--ar); }

  /* Top-view courtroom: fallback background, replaced by BG_TOPVIEW once it loads */
  #court { position: absolute; inset: 0; background-color: #7d7266;
    background-image: linear-gradient(rgba(0,0,0,.12) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,0,0,.12) 1px, transparent 1px);
    background-size: 2cqw 2cqw; }
  /* Prop z-index is set in JS by screen y (lower = in front) */
  .prop { position: absolute; }
  /* Desk: light top + dark front panel (drawer line) + legs */
  .prop.desk { background: linear-gradient(#8a5a34 0 40%, #2a170b 40% 43%, #4a2a16 43%);
               border: .25cqw solid #2a170b; border-radius: .3cqw; }
  .prop.desk::after { content: ''; position: absolute; left: 12%; right: 12%; top: 60%; height: 20%;
                      border: solid #2a170b; border-width: .2cqw 0; }
  .prop.desk::before, .prop.bench::before { content: ''; position: absolute; left: 6%; right: 6%; top: 100%; height: 1.2cqw;
                      border: solid #2a170b; border-width: 0 .7cqw; }
  /* Bench: backrest seen from behind (top rail + vertical slats) */
  .prop.bench { background: linear-gradient(#7a4a28 0 28%, #2a170b 28% 32%, transparent 32%),
                            repeating-linear-gradient(90deg, #4a2a16 0 2.4cqw, #2e1a0c 2.4cqw 2.7cqw);
                border: .25cqw solid #2a170b; border-radius: .4cqw .4cqw 0 0; }
  /* Side chair: backrest + seat + legs (.r = backrest on the right) */
  .prop.chair { border: solid #4a2e14; border-width: 0 0 .8cqw .8cqw; }
  .prop.chair.r { border-width: 0 .8cqw .8cqw 0; }
  .prop.chair::before { content: ''; position: absolute; left: 15%; right: 15%; top: 100%; height: 2cqw;
                        border: solid #4a2e14; border-width: 0 .4cqw; }
  /* Vertical desk (prosecutor/defender): top faces the avatar, front faces the center. .r mirrors it */
  .prop.desk.v { background: linear-gradient(90deg, #8a5a34 0 58%, #2a170b 58% 62%, #4a2a16 62%); }
  .prop.desk.v.r { background: linear-gradient(270deg, #8a5a34 0 58%, #2a170b 58% 62%, #4a2a16 62%); }
  .prop.desk.v::after { left: 70%; right: 12%; top: 30%; height: 40%; }
  .prop.desk.v.r::after { left: 12%; right: 70%; }
  /* Nameplate: brushed gold base around a black plate with a double gold border. Size/position/rotation set in JS from NAMEPLATES */
  .nameplate { position: absolute; z-index: 98; /* above desks, avatars and desk clips; below labels (100) */ display: flex; padding: .18em; pointer-events: none; border-radius: .12em;
               transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
               background: linear-gradient(var(--gold-dark), var(--gold-light) 50%, var(--gold-dark));
               box-shadow: 0 .05em .15em rgba(0,0,0,.6); }
  .nameplate b { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #111;
                 border: .06em solid var(--gold-base); box-shadow: inset 0 0 0 .08em #111, inset 0 0 0 .13em var(--gold-dark);
                 font: 700 1em "Noto Serif KR", "Batang", "AppleMyungjo", serif; letter-spacing: .2em; white-space: nowrap; }
  /* Gold gradient text; drop-shadow instead of text-shadow, which would paint over background-clip text */
  .nameplate span { margin-right: -.2em; background: linear-gradient(var(--gold-light), var(--gold-dark));
                    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 rgba(0,0,0,.9)); }
  .nameplate.stacked b { writing-mode: vertical-rl; text-orientation: upright; }
  .nameplate.stacked span { margin: 0 0 -.2em; }
  /* End ornaments: simple gold curls, only on large plates */
  .nameplate.ornate b::before, .nameplate.ornate b::after { content: ''; position: absolute; top: 50%; width: .55em; height: .55em;
    border: .07em solid; border-color: var(--gold-base) transparent transparent var(--gold-base); border-radius: 50%; }
  .nameplate.ornate b::before { left: .35em; transform: translateY(-50%) rotate(-45deg); }
  .nameplate.ornate b::after { right: .35em; transform: translateY(-50%) rotate(135deg); }
  /* Same background on top of the judge, clipped to the image desk, so the desk hides the lower body */
  #deskClip, #closeupDeskClip { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  #closeupDeskClip { background: center / cover no-repeat; }

  /* Align feet with margin instead of transform: no stacking context, so labels can rise above props */
  .avatar { position: absolute; --w: calc(4cqw * var(--scale)); width: var(--w); margin: calc(var(--w) * -4 / 3) 0 0 calc(var(--w) / -2);
            transition-property: left, top, margin-top; transition-timing-function: linear, linear, ease; }
  .avatar.sit { margin-top: calc(var(--w) * -1); }
  .avatar.out { visibility: hidden; }
  .avatar svg { position: relative; display: block; width: 100%; shape-rendering: crispEdges; }
  .avatar.step svg { transform: translateY(-4%); }
  .avatar.turn svg { scale: -1 1; }
  .back.talking svg { animation: bodybob .3s ease-in-out infinite alternate; }
  @keyframes bodybob { to { translate: 0 -3%; } }
  .open, .legB, .legS, .talk-open .closed, .step .legA, .sit .legA { display: none; }
  .talk-open .open, .step .legB, .sit .legS { display: inline; }
  .label { position: absolute; z-index: 100; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: calc(.3cqw * var(--scale));
           white-space: nowrap; font-size: calc(1cqw * var(--scale)); color: #fff; background: rgba(0,0,0,.6); padding: .1em .5em; border-radius: 3px; }

  /* Front close-up */
  #closeup { position: absolute; inset: 0; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .8s;
             background: #3a2f45 center / cover no-repeat; }
  #closeup.show { opacity: 1; }
  #closeup .label { font-size: 2cqw; }
  #closeup .avatar svg { animation: breathe 2s ease-in-out infinite alternate; }
  @keyframes breathe { to { translate: 0 1.5px; } }

  #sub { position: absolute; z-index: 210; left: 50%; bottom: 3%; transform: translateX(-50%); max-width: 90%;
         font-size: 1.8cqw; text-align: center; background: rgba(0,0,0,.7); padding: .4cqw 1.2cqw; border-radius: 4px; }
  #sub:empty { display: none; }
  #stage { font-family: var(--font-body); }

  /* Shared ribbon/parallelogram label: gold edge = gold wrapper + colored inner, both clipped to the same shape */
  .tag, .frame-tab { position: absolute; z-index: 1; padding: 1px; background: var(--gold-base); clip-path: var(--tag-shape); }
  .tag b, .frame-tab b { display: block; background: var(--tag, var(--tag-judge)); clip-path: var(--tag-shape); color: var(--ui-text);
                         font: 700 1em var(--font-title); letter-spacing: .08em; white-space: nowrap; }
  .tag { --tag-shape: polygon(6% 0, 100% 0, 94% 100%, 0 100%); }
  .frame-tab { --tag-shape: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%); top: 0; left: 1.5cqw; translate: 0 -55%; font-size: 1.2cqw; }
  .frame-tab b { padding: .25cqw 1.6cqw; }

  /* Dialogue box (DIALOGUE_MODE 'box'): size from DIALOGUE_BOX, colors from UI_PALETTE */
  #dialog { position: absolute; z-index: 216; /* above the cut-in dim (215) so the line stays readable */ left: 50%; translate: -50% 0; bottom: var(--dlg-bottom); width: var(--dlg-w); height: var(--dlg-h);
            padding: 2.6cqw 3cqw 1.6cqw; background: var(--ui-panel); color: var(--ui-text); border-top: 1px solid var(--gold-base);
            font-size: var(--dlg-font); line-height: 1.5; }
  #dialog::before { content: ''; position: absolute; left: 0; right: 0; top: 2px; border-top: 1px solid var(--gold-base); } /* 2nd line, 2px gap */
  #dialog[hidden] { display: none; }
  #dialog .tag { top: 0; left: 2cqw; translate: 0 -60%; font-size: .8em; }
  #dialog .tag b { padding: .2cqw 2.2cqw; }
  #dialog .tag[hidden] { display: none; }
  #dialog p { margin: 0; }
  #dialog .hl { color: var(--hl); }
  #dialog.rider p { color: var(--gold-light); font-weight: bold; }
  #dialog .more { display: none; position: absolute; right: 2cqw; bottom: 1.2cqw; border: .6cqw solid transparent; border-bottom: 0;
                  border-top: .8cqw solid var(--gold-base); animation: more .5s ease-in-out infinite alternate; }
  #dialog.done .more { display: block; }
  @keyframes more { to { translate: 0 .4cqw; opacity: .5; } }

  /* Speech bubble icon while talking */
  /* Sized in em of the label font, so it follows AVATAR_SCALE */
  .dots, .mark { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: .2em; font-size: 1.4em;
          line-height: 1; font-style: normal; white-space: nowrap; color: #222; background: #fff; border-radius: .7em; }
  .dots { display: none; padding: 0 .35em .3em; animation: bob .6s ease-in-out infinite alternate; }
  .talking .dots { display: block; }
  /* Vote mark: ?, ✓, or option short name */
  .mark { padding: .15em .35em; }
  .mark:empty { display: none; }
  @keyframes bob { from { transform: translate(-50%, 0); } to { transform: translate(-50%, -30%); } }

  /* Center panel: position and size come from config PANEL */
  .panel { position: absolute; z-index: 150; background: rgba(0,0,0,.75);
           color: #fff; border-radius: .6cqw; font-size: 1.1cqw; display: flex; flex-direction: column; }
  .panel[hidden] { display: none; }
  #casePanel { padding: 1.4cqw 1.2cqw .8cqw; }
  #casePanel .scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-width: none; } /* the panel itself stays overflow-visible for the tab and pattern */
  #casePanel h2 { margin: 0 0 .4cqw; font: 700 1.5cqw var(--font-title); }
  /* Legacy look at CASE_PANEL size: text in cqw of the panel itself, times the fit scale --case-k; height follows the content */
  #casePanel:not(.doc) { container-type: inline-size; translate: -50% -50%; padding: 2.6cqw 2.4cqw 1.8cqw; }
  #casePanel:not(.doc) .scroll { overflow: visible; }
  #casePanel:not(.doc) .frame-tab { font-size: calc(var(--case-issue) * .75 * var(--case-k) * 1cqw); }
  #casePanel:not(.doc) h2 { margin-bottom: .8cqw; font-size: calc(var(--case-title) * var(--case-k) * 1cqw); }
  #casePanel:not(.doc) p { margin: .6cqw 0 1.2cqw; font-size: calc(var(--case-body) * var(--case-k) * 1cqw); line-height: var(--case-lh); }
  #casePanel:not(.doc) ol { padding-left: 1.4em; font-size: calc(var(--case-issue) * var(--case-k) * 1cqw); line-height: var(--case-lh); }
  #casePanel p, #casePanel ol { margin: .3cqw 0; }
  @counter-style circled { system: fixed; symbols: '①' '②' '③' '④' '⑤'; suffix: ' '; }
  #casePanel ol { list-style: circled; padding-left: 1.6cqw; }
  /* Case intro, CASE_PANEL_STYLE 'document': paper record sheet. Text sizes are cqw of the panel itself, times the fit scale --case-k */
  #casePanel.doc { container-type: inline-size; display: block; translate: -50% -50%; rotate: var(--case-tilt); border-radius: 0;
    padding: 3.6cqw 3.4cqw 2.6cqw; background: var(--case-noise), var(--case-paper); color: var(--case-ink); font-family: var(--case-serif);
    border: 6px solid var(--case-burgundy);
    box-shadow: inset 0 0 0 1.5px var(--gold-base), inset 0 0 0 4.5px var(--case-paper), inset 0 0 0 5.5px var(--gold-base),
                0 14px 44px rgba(0,0,0,.65), 0 0 6cqw 1.5cqw rgba(0,0,0,.5);
    animation: caseIn 450ms ease-out backwards, caseShake 160ms 650ms; }
  #casePanel.doc[hidden] { display: none; }
  #casePanel.doc::after { content: ''; position: absolute; inset: 10px; pointer-events: none; --c: var(--gold-base); --l: 2.2cqw; --t: 2px;
    background:
      linear-gradient(var(--c), var(--c)) left top / var(--l) var(--t) no-repeat,
      linear-gradient(var(--c), var(--c)) left top / var(--t) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) right top / var(--l) var(--t) no-repeat,
      linear-gradient(var(--c), var(--c)) right top / var(--t) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) left bottom / var(--l) var(--t) no-repeat,
      linear-gradient(var(--c), var(--c)) left bottom / var(--t) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) right bottom / var(--l) var(--t) no-repeat,
      linear-gradient(var(--c), var(--c)) right bottom / var(--t) var(--l) no-repeat; }
  @keyframes caseIn { from { transform: translateY(24px); opacity: 0; } }
  @keyframes caseShake { 25% { transform: translate(2px, -1px); } 50% { transform: translate(-2px, 1px); } 75% { transform: translate(1px, 0); } }
  /* Title ribbon over the top edge: notched ends, darker folded tails behind */
  .case-ribbon { position: absolute; z-index: 1; top: 0; left: 50%; width: 42%; translate: -50% -58%; }
  .case-ribbon::before, .case-ribbon::after { content: ''; position: absolute; z-index: -1; top: 28%; width: 14%; height: 100%; background: #3d0c14; }
  .case-ribbon::before { left: -9%; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 35% 50%); }
  .case-ribbon::after { right: -9%; clip-path: polygon(0 0, 100% 0, 65% 50%, 100% 100%, 0 100%); }
  .case-ribbon b { display: block; padding: .45em 0; text-align: center; color: var(--case-paper); letter-spacing: .35em;
    font: 700 calc(var(--case-issue) * var(--case-k) * 1cqw) / 1.4 var(--case-serif);
    background: linear-gradient(#8a2232, var(--case-burgundy) 55%, #4f111b); clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%); }
  #casePanel.doc h2 { margin: 0 0 1.4cqw; padding-bottom: .9cqw; text-align: center; border-bottom: 3px double var(--case-burgundy);
    font: 700 calc(var(--case-title) * var(--case-k) * 1cqw) / 1.3 var(--case-serif); }
  #casePanel.doc p { margin: 0 0 1.6cqw; font-size: calc(var(--case-body) * var(--case-k) * 1cqw); line-height: var(--case-lh); }
  .case-hl { color: var(--case-burgundy); }
  .case-sub { display: inline-block; margin-bottom: .6cqw; padding: .15em 1.6em .15em .8em; background: var(--case-burgundy); color: var(--case-paper);
    font: 700 calc(var(--case-issue) * .75 * var(--case-k) * 1cqw) / 1.5 var(--case-serif); letter-spacing: .2em;
    clip-path: polygon(0 0, 100% 0, 88% 50%, 100% 100%, 0 100%); }
  #casePanel.doc ol { margin: 0; padding: 0; list-style: none; counter-reset: issue; font-size: calc(var(--case-issue) * var(--case-k) * 1cqw); line-height: var(--case-lh); }
  #casePanel.doc li { counter-increment: issue; display: grid; grid-template-columns: auto 1fr; gap: .6em; align-items: start; padding: .45em 0; }
  #casePanel.doc li + li { border-top: 1.5px dotted rgba(42,26,20,.45); }
  #casePanel.doc li::before { content: counter(issue); display: grid; place-items: center; width: 1.5em; height: 1.5em; margin-top: calc((var(--case-lh) * 1em - 1.5em) / 2);
    border: 1.5px solid var(--gold-dark); border-radius: 50%; font-size: 1em; line-height: 1; font-weight: 700; color: var(--case-burgundy); }
  /* Seal: double ring + text, slightly blurred edge, stamped in when the panel has landed */
  .case-seal { position: absolute; z-index: 2; right: -2.5cqw; bottom: -3cqw; width: 14cqw; aspect-ratio: 1; display: grid; place-items: center;
    border: .55cqw solid var(--case-seal); border-radius: 50%; color: var(--case-seal); rotate: -12deg; opacity: .85; mix-blend-mode: multiply;
    font: 700 3cqw / 1.15 var(--case-serif); text-align: center; letter-spacing: .1em; box-shadow: 0 0 2px var(--case-seal), inset 0 0 2px var(--case-seal);
    filter: blur(.25px); animation: sealHit 200ms 450ms ease-in backwards; }
  .case-seal::before { content: ''; position: absolute; inset: 7%; border: .25cqw solid var(--case-seal); border-radius: 50%; }
  .case-seal span { width: 3.2em; }
  @keyframes sealHit { from { transform: scale(1.5); opacity: 0; } }
  /* Scene behind the document panel: dimmed and slightly blurred */
  #caseBackdrop { display: none; position: absolute; inset: 0; z-index: 149; pointer-events: none;
    background: rgba(0,0,0,var(--case-dim)); backdrop-filter: blur(var(--case-blur)); animation: caseDim 450ms ease-out; }
  #casePanel:not([hidden]) + #caseBackdrop { display: block; }
  @keyframes caseDim { from { opacity: 0; } }
  /* Trial log: translucent white background (opacity from config CHAT_BG_OPACITY) + dark text */
  /* Size from config CHAT_PANEL: text in cqw of the chat window itself, paddings in em so they scale with the text */
  #chat { container-type: inline-size; translate: -50% -50%; background: rgba(255,255,255,var(--chat-bg-op)); backdrop-filter: blur(2px); color: #222;
          font-size: calc(var(--chat-body) * 1cqw); line-height: var(--chat-lh); padding-top: 1.6cqw; }
  #chat .frame-tab { font-size: calc(var(--chat-title) * 1cqw); }
  #chat .frame-tab b { padding: .2em 1.3em; }
  #msgs { flex: 1; overflow-y: auto; padding: .4cqw 2.4cqw; scrollbar-width: none; }
  #msgs::-webkit-scrollbar { display: none; }
  /* CHAT_VISIBLE_MESSAGES 1: one message centered; the old one slides up and out, the new one rises in */
  /* New message rises in at the bottom of the stack */
  #msgs .msg.in { animation: msgIn 250ms ease-out; }
  @keyframes msgIn { from { transform: translateY(12px); opacity: 0; } }
  .msg { margin: 0 0 var(--chat-gap); opacity: .7; font-size: calc(var(--chat-body) * 1cqw); }
  .msg b { display: block; font-size: calc(var(--chat-name) * 1cqw); color: #333; }
  .msg > span { display: inline-block; background: rgba(255,255,255,.9); color: #222; padding: .2em .53em; border-radius: .47em; }
  .msg.cur { opacity: 1; }
  .msg.cur > span { background: #fff3b0; }
  .msg.sys { opacity: 1; text-align: center; }
  .msg.sys > span { background: rgba(190,190,190,.8); color: #222; font-size: .87em; }
  #chatInput { margin: .35em 1em 0; font-size: calc(var(--chat-input) * 1cqw); padding: .2em .35em; background: #fff; color: #222; }
  #chatInput::placeholder { color: #666; }
  #notice { margin: .15em 1.2em .4em; color: #b00000; font-size: calc(var(--chat-input) * .85cqw); font-weight: bold; }
  #votePanel { padding: .8cqw 1.2cqw; gap: .5cqw; }
  #votePanel h2 { margin: 0; font: 700 1.5cqw var(--font-title); text-align: center; }
  /* Vote options as a list menu: cream bar + triangle cursor on the hovered (or chosen) row */
  #votePanel button { position: relative; font: 1.4cqw var(--font-body); text-align: left; padding: .4cqw 1cqw .4cqw 2.6cqw;
                      border: 0; background: transparent; color: inherit; cursor: pointer; }
  #votePanel button.sel, #votePanel button.chosen { background: #f3e6c4; color: #2a1a0e; }
  #votePanel button.sel::before, #votePanel button.chosen::before { content: ''; position: absolute; left: 1cqw; top: 50%; translate: 0 -50%;
    border: .5cqw solid transparent; border-right: 0; border-left: .7cqw solid #2a1a0e; }
  #votePanel button:disabled { cursor: default; }
  #votePanel button:disabled:not(.chosen) { opacity: .5; }
  .bar-row { display: flex; align-items: center; gap: .6cqw; }
  .bar-row span { width: 8cqw; }
  .bar { flex: 1; height: 1.2cqw; background: rgba(255,255,255,.15); }
  .bar i { display: block; height: 100%; background: #8aa; }
  .bar-row.win { color: #ffe08a; font-weight: bold; }
  .bar-row.win .bar i { background: #ffe08a; }
  #chatInput:disabled { background: #ccc; color: #666; }
  .overlay { position: absolute; inset: 0; z-index: 220; display: flex; align-items: center; justify-content: center;
             background: rgba(0,0,0,.65); transition: opacity .6s; }
  .overlay[hidden] { display: none; }
  .overlay.fade { opacity: 0; }
  .card { width: 30cqw; display: flex; flex-direction: column; gap: .8cqw; padding: 2cqw 3cqw; text-align: center;
          background: #2a2230; color: #fff; border-radius: 1cqw; }
  .card h1 { margin: 0; font-size: 2.6cqw; }
  .card p { margin: 0 0 .6cqw; font-size: 1.4cqw; color: #ccc; }
  .card button { display: flex; justify-content: center; gap: 1cqw; font-size: 1.3cqw; padding: .6cqw; cursor: pointer; }
  .card button:disabled { background: #666; color: #bbb; cursor: default; }
  /* Outro: next-trial teaser card in the translucent white panel tone + one gold accent */
  #endOverlay { flex-direction: column; gap: 1.2cqw; }
  .card.outro { position: relative; background: rgba(255,255,255,.75); backdrop-filter: blur(2px); color: #222; }
  .card h1 { font-family: var(--font-title); }

  /* Decorative frame: gold double border (2px, 3px dark gap, 1px), gold corner L + dot, optional striped band outside */
  .frame { border: 2px solid var(--gold-base); box-shadow: inset 0 0 0 3px #2a170b, inset 0 0 0 4px var(--gold-base); }
  .frame::after { content: ''; position: absolute; inset: 6px; pointer-events: none; --c: var(--gold-base); --l: 1.1cqw; --t: 2px;
    background:
      linear-gradient(var(--c), var(--c)) left top / var(--l) var(--t) no-repeat,

  /* Striped band: a 6px ring just outside the border (mask cuts out the middle) */
  .frame.patterned::before { content: ''; position: absolute; inset: -9px; padding: 6px; pointer-events: none; border-radius: inherit;
    background: repeating-linear-gradient(45deg, #5a2a3a 0 4px, #43304f 4px 8px);

function spriteSVG(view, pal, mirror) {
  const colors = { h: '#3b2a20', s: '#f1c9a0', E: '#222', p: '#444a55', ...pal };
  const r = (x, y, w, h, fill, cls = '') => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
  let body = '';
  SPRITES[view].forEach((row, y) => [...row].forEach((ch, x) => {
    if (colors[ch]) body += r(x, y, 1, 1, colors[ch]);
  }));
  const p = colors.p;
  // legA standing, legB walk frame 2, legS side sitting (thighs forward); seated: forearms + hands instead of legs
  const { y: ay, handX } = CLOSEUP_ARMS;
  body += view === 'seated'
    ? r(0, ay, 12, 1, colors.c) + handX.map((hx, i) => r(hx, ay, 2, 2, colors.s, i ? '' : 'rhand')).join('')
    : view === 'side'
    ? r(4, 14, 2, 2, p, 'legA') + r(3, 14, 1, 2, p, 'legB') + r(6, 14, 1, 2, p, 'legB') + r(6, 13, 3, 1, p, 'legS') + r(8, 14, 1, 2, p, 'legS')
      + r(5, 13, 2, 2, p, 'legK') + r(1, 14, 4, 1, p, 'legK') + r(9, 12, 2, 2, colors.s, 'fist') // kneeling: thigh down, shin back on the floor

    : r(2, 15, 3, 1, p, 'legA') + r(7, 15, 3, 1, p, 'legA') + r(3, 15, 2, 1, p, 'legB') + r(8, 15, 2, 1, p, 'legB');
  const m = MOUTH[view];
  if (m) body += r(m[0], m[1], 2, 1, '#7a3b2e', 'closed') + r(m[0], m[1], 2, 2, '#4a1010', 'open');
  return `<svg viewBox="0 0 12 ${view === 'seated' ? ay + 2 : 16}">${mirror ? `<g transform="matrix(-1 0 0 1 12 0)">${body}</g>` : body}</svg>`;
}

function makeAvatar(a, view = a.color ? 'back' : a.id === 'judge' ? 'front' : 'side') {

  el.firstChild.style.zIndex = Math.round(a.y); // lower seats are in front
  return el;
}

  el.style.zIndex = 98; // the animated avatar becomes its own layer; keep it above chairs and desks
  sit([id], false);
  el.animate([{ translate: '0 0' }, { translate: `-${R.jumpSway}% -${R.jumpHeight}%`, offset: .45 },
              { translate: `${R.jumpSway}% -${R.jumpHeight}%`, offset: .55 }, { translate: '0 0' }],
             { duration: R.jumpMs, iterations: R.jumps, easing: 'ease-in-out' });
  for (let i = 0; i < R.fireworks; i++) setTimeout(() => g === gen && firework(el), i * R.fireworkGapMs);
  await wait(R.totalMs - R.floatMs);
  if (g !== gen) return;
  const b = balloons();
  el.append(b);
  b.animate([{ opacity: 0, scale: .3 }, { opacity: 1, scale: 1 }], { duration: 300, fill: 'forwards' });
  const h = court.clientHeight, s = R.floatSway;
  await finished(el.animate([{ translate: '0 0' }, { translate: `-${s}cqw ${-h * .25}px` }, { translate: `${s}cqw ${-h * .5}px` },
                             { translate: `-${s}cqw ${-h * .75}px` }, { translate: `0 ${-h}px` }],
                            { duration: R.floatMs, easing: 'ease-in', fill: 'forwards' }));
  if (g !== gen) return;
  el.classList.add('out'); // hides the avatar with its label, icons and balloons
}
// Short impact lines + dust at the fist
function impact(el, dir) {
  const box = tag('div');
  box.className = 'impact fx';
  Object.assign(box.style, { left: `calc(${el.style.left} + ${dir * 2.2}cqw)`, top: `calc(${el.style.top} + 1cqw)` });
  [-150, -115, -65, -30].forEach(deg => {
    const ray = tag('i');
    Object.assign(ray.style, { width: '1.2cqw', height: '.18cqw', rotate: deg + 'deg', translate: '0 -50%' });
    box.append(ray);
  });
  [[-1.2, .2], [1, .1], [.2, .4]].forEach(([x, y]) => {
    const dot = tag('b');
    Object.assign(dot.style, { width: '.4cqw', height: '.4cqw', left: x + 'cqw', top: y + 'cqw' });
    box.append(dot);
  });
  court.append(box);
  box.animate([{ opacity: 1, scale: .6 }, { opacity: 0, scale: 1.3 }], { duration: 350, easing: 'ease-out', fill: 'forwards' });
  setTimeout(() => box.remove(), 350);
}
// Loser: step forward, kneel, pound the floor; stays kneeling after
async function lament(id, g) {
  const R = REACTION, el = els[id], dir = STAND_DIR[id], seat = seatOf(id);
  el.style.zIndex = 98;
  sit([id], false);
  await wait(300);
  if (g !== gen) return;
  await walk(el, { x: seat.x + R.kneelOffset * dir, y: seat.y }, g);
  if (g !== gen) return;
  el.classList.add('kneel');
  const sweat = Object.assign(tag('i'), { className: 'react sweat fx' });
  sweat.style.background = R.sweatColor;
  el.querySelector('.label').append(sweat);
  const fist = el.querySelector('.fist');
  for (let i = 0; i < R.pounds; i++) {
    await finished(fist.animate([{ translate: '0 0' }, { translate: `0 -${R.fistLift}px`, offset: .4 },
                                 { translate: `0 -${R.fistLift}px`, offset: .7 }, { translate: '0 0' }],
                                { duration: R.poundMs, easing: 'ease-in' }));
    if (g !== gen) return;
    impact(el, dir);
    el.animate([{ translate: '-.4cqw 0' }, { translate: '.4cqw 0' }, { translate: '-.2cqw 0' }, { translate: '0 0' }], { duration: 180 });
  }
  sweat.remove(); // short frustration mark; the kneeling pose stays
}
function showVoteResult() {
  const { counts, votes, result } = VERDICT;
  votePanel.replaceChildren(tag('h2', '평결 결과'), ...OPTIONS.map(o => {
    const row = tag('div');
    row.className = 'bar-row' + (o === result ? ' win' : '');
    const bar = tag('div');
    bar.className = 'bar';
    bar.append(tag('i'));
    bar.firstChild.style.width = counts[o] / Object.keys(votes).length * 100 + '%';
    row.append(tag('span', OPTION_LABELS[o]), bar, tag('b', counts[o]));
    return row;
  }));
  votePanel.hidden = false;
  Object.entries(votes).forEach(([id, v]) => setMark(id, OPTION_SHORT[v]));
}
function leaveCloseup() {
  setTalking(closeJudge, false);
  closeup.classList.remove('show');
  caption('');
}
let pickRole = null; // stage 0: resolves when the juror card or ▶ is pressed
let lineSkip = null; // during a cut-in line: ▶ completes the typing, then ends the hold (logo: ▶ if LOGO_NEXT_BUTTON_ENABLED)
// Stage 0: logo alone on the dark overlay; stays until clicked, then shrinks out and the role cards show
async function logoIntro(g) {
  roleCard.style.visibility = 'hidden';
  logoEl.hidden = false;
  logoEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: LOGO_FADEIN_MS, fill: 'forwards' });
  nextBtn.disabled = !LOGO_NEXT_BUTTON_ENABLED;
  await new Promise(r => {
    logoImg.onclick = r;
    if (LOGO_NEXT_BUTTON_ENABLED) lineSkip = r;
  });
  logoImg.onclick = lineSkip = null; // later clicks are ignored
  if (g !== gen) return;
  nextBtn.disabled = true;
  await finished(logoEl.animate([{ opacity: 1, scale: 1 }, { opacity: 0, scale: .5 }],
                                { duration: LOGO_OUT_MS, easing: 'ease-in', fill: 'forwards' }));
  if (g !== gen) return;
  nextBtn.disabled = false; // ▶ picks the juror role, as before
  endLogo();
}
function endLogo() {
  logoEl.getAnimations().forEach(an => an.cancel());
  logoEl.hidden = true;
  roleCard.style.visibility = '';
}

// Stages 0~13. name is shown as a subtitle when the stage starts (empty = no subtitle).
// autoNext: chain into the next stage without ▶. waitsForInput: no safety timer (waits for the user)
const STAGES = [
  { name: '', autoNext: true, waitsForInput: true, run: async g => { // 0 role select
    roleOverlay.classList.remove('fade');
    roleOverlay.hidden = false;
    nextBtn.disabled = false; // ▶ picks the juror role (logoIntro handles ▶ while the logo is up)
    if (LOGO_INTRO_ENABLED) await logoIntro(g);
    if (g !== gen) return;
    await new Promise(r => pickRole = r);
    pickRole = null;
    if (g !== gen) return;
    nextBtn.disabled = true;
    roleOverlay.classList.add('fade');
    await wait(600);
    roleOverlay.hidden = true;
  } },
  { name: '', run: async g => {
    await Promise.all(ENTRY_ORDER.map(async (id, i) => {
      await wait(i * ENTRY_GAP_MS);
      if (g !== gen) return;
      await walk(els[id], seatOf(id), g);
      if (g === gen) sit([id], true);
    }));
    if (g === gen) caption('배심원단과 양측이 모두 입장했습니다');
  } },
  { name: '재판장 입장', run: async g => {
    sit(OTHERS, false);
    place(els.judge, JUDGE_DOOR);
    await walk(els.judge, AVATARS[0], g);
  } },
  { name: '', run: async g => { // TTS + bubble icon + mouth, no subtitle/chat
    sit(['judge'], true);
    els.judge.classList.add('talking');
    setTalking(els.judge, true);
    const line = '지금부터 개정합니다';
    speech('judge', line);
    const t = speak(line);
    await wait(600);
    if (g === gen) sit(OTHERS, true);
    await t;
    if (g !== gen) return;
    lineDone();
    els.judge.classList.remove('talking');
    setTalking(els.judge, false);
  } },
  { name: '사건을 소개합니다', speaker: 'judge', run: async g => { // the stage name is the judge's line
    casePanel.hidden = false;
    fitCasePanel();
    setTalking(els.judge, true);
    await wait(2500);
    if (g !== gen) return;
    setTalking(els.judge, false);
    lineDone();
  } },
  { name: '모두진술', run: async g => {
    casePanel.hidden = true;
    setInputEnabled(false);
    await sayAll(['prosecutor', 'defender'].map(id => ({ id, text: OPENING[id] })), g);
  } },
  { name: '쟁점별 주장·반박', run: async g => {
    gauge.classList.remove('fade');
    gauge.hidden = false; // shown from here until the vote
    for (const { title, lines } of ISSUE_DEBATE) {
      typeMsg(addMsg('msg sys', tag('span', title)).lastChild);
      speech(null, title);
      if (DIALOGUE_MODE === 'box') await wait(LINE_HOLD_AFTER_TYPING_MS); // let the title be read before a cut-in covers the screen
      if (g !== gen) return;
      await sayAll(lines, g);
      if (g !== gen) return;
    }
  } },
  { name: '종결', run: g => sayAll(CLOSING, g) },
  { name: '배심원 토론', run: async g => {
    setInputEnabled(true);
    for (const { id, text } of JUROR_LINES) {
      await say(id, text, JUROR_MS, g);
      if (g !== gen) return;
    }
  } },
  { name: '', run: g => filterDemo(g) }, // 9 chat filter demo, on its own ▶
  { name: '평결 투표', waitsForInput: true, run: async g => {
    chat.hidden = true;
    gauge.classList.add('fade');
    setTimeout(() => g === gen && (gauge.hidden = true), GAUGE.fadeMs);
    const votes = { [ME]: null, ...NPC_VOTES };
    Object.keys(votes).forEach(id => setMark(id, '?'));
    const buttons = OPTIONS.map(o => tag('button', OPTION_LABELS[o]));
    votePanel.replaceChildren(tag('h2', '평결을 선택해 주세요'), ...buttons);
    votePanel.hidden = false;
    // List-menu cursor follows the mouse; clicking confirms as before
    buttons.forEach(b => b.onmouseenter = () => buttons.forEach(x => x.classList.toggle('sel', x === b && !b.disabled)));
    buttons[0].classList.add('sel');
    votes[ME] = await new Promise(r => buttons.forEach((b, i) => b.onclick = () => {
      buttons.forEach(x => x.disabled = true);
      b.classList.add('chosen');
      r(OPTIONS[i]);
    }));
    if (g !== gen) return;
    setMark(ME, OPTION_SHORT[votes[ME]]);
    for (const id of Object.keys(NPC_VOTES)) {
      await wait(NPC_VOTE_MS);
      if (g !== gen) return;
      setMark(id, '✓');
    }
    await wait(1000);
    if (g !== gen) return;
    const counts = Object.fromEntries(OPTIONS.map(o => [o, 0]));
    Object.values(votes).forEach(v => counts[v]++);
    VERDICT = { result: OPTIONS.reduce((a, b) => counts[b] > counts[a] ? b : a), counts, votes };
    showVoteResult();
  } },
  // 11 → 12 → 13 play through without ▶
  { name: '판결 선고', autoNext: true, run: async g => { // reading → 3 gavel strikes → pause → back to the top view
    votePanel.hidden = true;
    closeup.classList.add('show');
    await wait(800);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const lines = JUDGMENT_TEXTS[VERDICT.result].split(/(?<=[.!?])\s+/);
    lines.push(JUDGMENT_RIDERS[VERDICT.result]);
    dbg('reading start,', lines.length, 'utterances');
    for (const [i, line] of lines.entries()) {
      if (g !== gen) return;
      caption(line, i === lines.length - 1 ? { rider: true } : { id: 'judge' });
      setTalking(closeJudge, true);
      const why = await speak(line);
      setTalking(closeJudge, false);
      lineDone();
      dbg('utterance', i + 1, 'done:', why);
    }
    if (g !== gen) return;
    dbg('gavel start');
    let stamp = null;
    await gavelStrikes(3, g, i => { if (i === 2) stamp = showStamp(VERDICT_STAMPS[VERDICT.result]); });
    await wait(CUTIN.stampMs - (GAVEL.gapMs - GAVEL.raiseMs - GAVEL.strikeMs)); // the stamp stays ~stampMs after the 3rd hit
    if (g !== gen) return;
    stamp?.remove();
    await wait(GAVEL.pauseMs);
    if (g !== gen) return;
    leaveCloseup();
  } },
  { name: '', autoNext: true, run: async g => { // 12: reactions, then the closing line (subtitle set here, not as the stage name)
    const winner = WINNER[VERDICT.result];
    const loser = winner === 'prosecutor' ? 'defender' : 'prosecutor';
    dbg('reaction:', winner, 'wins');
    await Promise.all([celebrate(winner, g), lament(loser, g), wait(REACTION.totalMs)]);
    if (g !== gen) return;
    caption(CLOSING_LINE, { id: 'judge' });
    gavel(1, g);
    await talk(els.judge, 2500, g);
    if (g !== gen) return;
    lineDone();
    sit(['judge', ...OTHERS], false);
    await wait(600);
    if (g !== gen) return;
    await walk(els.judge, JUDGE_DOOR, g);
    if (g !== gen) return;
    els.judge.classList.add('out');
  } },
  { name: '', run: async () => { endOverlay.hidden = false; } }, // 13 outro: next trial teaser (last stage)
];

let cur = 0; // stage being played (or last played)
// Plays stage i to the end, then chains (autoNext) or enables ▶. A failed or stuck stage still ends with ▶ enabled
async function runStage(i) {
  const g = gen, s = STAGES[i];
  cur = i;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = true;
  caption(s.name, { id: s.speaker });
  if (i >= 5 && i <= 9) chat.hidden = !chatShownAt(i);
  gaugeLine = 0;
  dbg('stage', i, 'start');
  const runs = [s.run(g).then(() => 'done')];
  if (!s.waitsForInput) runs.push(wait(SAFETY_UNLOCK_MS).then(() => 'safety timer'));
  let why;
  try { why = await Promise.race(runs); } catch (e) { why = 'error'; console.error('[court] stage', i, 'failed', e); }
  if (g !== gen) return;
  dbg('stage', i, 'end:', why);
  if (why === 'done' && s.autoNext && i + 1 < STAGES.length) return runStage(i + 1);
  nextBtn.disabled = i + 1 >= STAGES.length;
}
// Stops whatever is playing: pending stage code bails on the gen check
function stopPlayback() {
  gen++;
  pickRole = lineSkip = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  [...timers.keys()].forEach(k => loop(k, false));
  stage.classList.remove('gavel', 'gavel-hit');
}
// Start state of stage i, built instantly: avatar positions/poses, panels, trial log, vote state
function buildState(i) {
  AVATARS.forEach(a => {
    const el = els[a.id];
    const judge = a.id === 'judge';
    const inside = judge ? i >= 3 && i < 13 : i >= 2; // judge enters in 2, leaves in 12
    const seated = judge ? i >= 4 && i < 13 : i === 2 || i >= 4 && i < 13; // all stand for the judge (2→3) and at the end
    el.dataset.id = a.id;
    el.className = `avatar ${el.dataset.view}` + (inside ? '' : ' out') + (seated ? ' sit' : '');
    el.getAnimations({ subtree: true }).forEach(an => an instanceof CSSAnimation || an.cancel()); // reaction motion
    el.style.zIndex = '';
    place(el, inside ? a : judge ? JUDGE_DOOR : DOOR);
  });
  document.querySelectorAll('.react, .fx').forEach(el => el.remove());
  hideCutin();
  gauge.classList.remove('fade');
  gauge.hidden = !(i >= 7 && i <= 10); // stage 6 shows it when it starts
  setGauge(gaugeAt(i), false);
  roleOverlay.hidden = endOverlay.hidden = true;
  endLogo();
  closeup.classList.remove('show');
  closeJudge.className = 'avatar';
  gavelEl.classList.remove('up');
  caption('');
  casePanel.hidden = i !== 4;
  chat.hidden = !(i >= 6 && i <= 10 && chatShownAt(i - 1)); // start of i = end of i - 1
  setInputEnabled(i === 9 || i === 10);
  msgs.textContent = chatInput.value = notice.textContent = '';
  const log = [];
  // Only lines from stages that showed the log, so a stage's replay starts its own messages from scratch
  if (i >= 6 && chatShownAt(5)) log.push(...['prosecutor', 'defender'].map(id => ({ id, text: OPENING[id] })));
  if (i >= 7 && chatShownAt(6)) ISSUE_DEBATE.forEach(({ title, lines }) => log.push({ title }, ...lines));
  if (i >= 8 && chatShownAt(7)) log.push(...CLOSING);
  if (i >= 9 && chatShownAt(8)) log.push(...JUROR_LINES);
  log.forEach(l => l.title ? addMsg('msg sys', tag('span', l.title)) : addMsg('msg', tag('b', seatOf(l.id).label), tag('span', l.text)));
  document.querySelectorAll('.mark').forEach(m => m.textContent = '');
  votePanel.hidden = true;
  if (i <= 10) VERDICT = null;
  else if (i === 11) showVoteResult();
  else Object.entries(VERDICT.votes).forEach(([id, v]) => setMark(id, OPTION_SHORT[v]));
}
function goTo(i) {
  stopPlayback();
  buildState(i);
  runStage(i);
}

document.getElementById('pickJuror').onclick = () => pickRole?.();
prevBtn.onclick = () => { if (!prevBtn.disabled) goTo(cur - 1); };
nextBtn.onclick = () => {
  if (nextBtn.disabled) return;
  if (lineSkip) return lineSkip();
  if (pickRole) return pickRole();
  stopPlayback(); // only matters if the safety timer enabled ▶ while the stage was still running
  runStage(cur + 1);
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === 'ArrowRight') nextBtn.click();
});
goTo(0);
</script>
