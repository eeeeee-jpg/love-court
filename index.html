<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법정 시연</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: #111; color: #eee; font-family: sans-serif;
         display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  #bar { height: 40px; flex: none; display: flex; gap: 8px; align-items: center; }
  #bar button { font-size: 13px; padding: 4px 10px; cursor: pointer; }
  #stage { position: relative; overflow: hidden; container-type: inline-size;
           width: min(100vw, calc((100vh - 40px) * var(--ar))); aspect-ratio: var(--ar); }

  /* Top-view courtroom: fallback background, replaced by BG_TOPVIEW once it loads */
  #court { position: absolute; inset: 0; background-color: #7d7266;
    background-image: linear-gradient(rgba(0,0,0,.12) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,0,0,.12) 1px, transparent 1px);
    background-size: 2cqw 2cqw; }
  /* Prop z-index is set in JS by screen y (lower = in front) */
  .prop { position: absolute; }
  /* Desk: light top + dark front panel (drawer line) + legs */
  .prop.desk { background: linear-gradient(#8a5a34 0 40%, #2a170b 40% 43%, #4a2a16 43%);
               border: .25cqw solid #2a170b; border-radius: .3cqw; }
  .prop.desk::after { content: ''; position: absolute; left: 12%; right: 12%; top: 60%; height: 20%;
                      border: solid #2a170b; border-width: .2cqw 0; }
  .prop.desk::before, .prop.bench::before { content: ''; position: absolute; left: 6%; right: 6%; top: 100%; height: 1.2cqw;
                      border: solid #2a170b; border-width: 0 .7cqw; }
  /* Bench: backrest seen from behind (top rail + vertical slats) */
  .prop.bench { background: linear-gradient(#7a4a28 0 28%, #2a170b 28% 32%, transparent 32%),
                            repeating-linear-gradient(90deg, #4a2a16 0 2.4cqw, #2e1a0c 2.4cqw 2.7cqw);
                border: .25cqw solid #2a170b; border-radius: .4cqw .4cqw 0 0; }
  /* Side chair: backrest + seat + legs (.r = backrest on the right) */
  .prop.chair { border: solid #4a2e14; border-width: 0 0 .8cqw .8cqw; }
  .prop.chair.r { border-width: 0 .8cqw .8cqw 0; }
  .prop.chair::before { content: ''; position: absolute; left: 15%; right: 15%; top: 100%; height: 2cqw;
                        border: solid #4a2e14; border-width: 0 .4cqw; }
  /* Vertical desk (prosecutor/defender): top faces the avatar, front faces the center. .r mirrors it */
  .prop.desk.v { background: linear-gradient(90deg, #8a5a34 0 58%, #2a170b 58% 62%, #4a2a16 62%); }
  .prop.desk.v.r { background: linear-gradient(270deg, #8a5a34 0 58%, #2a170b 58% 62%, #4a2a16 62%); }
  .prop.desk.v::after { left: 70%; right: 12%; top: 30%; height: 40%; }
  .prop.desk.v.r::after { left: 12%; right: 70%; }
  .prop.desk.v .plate { left: 29%; top: 40%; font-size: .8cqw; padding: 0 .3cqw; }
  .prop.desk.v.r .plate { left: 71%; }
  .plate { position: absolute; left: 50%; top: 6%; transform: translateX(-50%); white-space: nowrap; font-size: 1.1cqw;
           padding: 0 .5cqw; background: #f3e6c4; color: #3e2612; border: .15cqw solid #a07a3a; }
  /* Same background on top of the judge, clipped to the image desk, so the desk hides the lower body */
  #deskClip, #closeupDeskClip { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  #closeupDeskClip { background: center / cover no-repeat; }

  /* Align feet with margin instead of transform: no stacking context, so labels can rise above props */
  .avatar { position: absolute; --w: calc(4cqw * var(--scale)); width: var(--w); margin: calc(var(--w) * -4 / 3) 0 0 calc(var(--w) / -2);
            transition-property: left, top, margin-top; transition-timing-function: linear, linear, ease; }
  .avatar.sit { margin-top: calc(var(--w) * -1); }
  .avatar.out { visibility: hidden; }
  .avatar svg { position: relative; display: block; width: 100%; shape-rendering: crispEdges; }
  .avatar.step svg { transform: translateY(-4%); }
  .avatar.turn svg { scale: -1 1; }
  .back.talking svg { animation: bodybob .3s ease-in-out infinite alternate; }
  @keyframes bodybob { to { translate: 0 -3%; } }
  .open, .legB, .legS, .talk-open .closed, .step .legA, .sit .legA { display: none; }
  .talk-open .open, .step .legB, .sit .legS { display: inline; }
  .label { position: absolute; z-index: 100; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: calc(.3cqw * var(--scale));
           white-space: nowrap; font-size: calc(1cqw * var(--scale)); color: #fff; background: rgba(0,0,0,.6); padding: .1em .5em; border-radius: 3px; }

  /* Front close-up */
  #closeup { position: absolute; inset: 0; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .8s;
             background: #3a2f45 center / cover no-repeat; }
  #closeup.show { opacity: 1; }
  #closeup .label { font-size: 2cqw; }
  #closeup .avatar svg { animation: breathe 2s ease-in-out infinite alternate; }
  @keyframes breathe { to { translate: 0 1.5px; } }

  #sub { position: absolute; z-index: 210; left: 50%; bottom: 3%; transform: translateX(-50%); max-width: 90%;
         font-size: 1.8cqw; text-align: center; background: rgba(0,0,0,.7); padding: .4cqw 1.2cqw; border-radius: 4px; }
  #sub:empty { display: none; }

  /* Speech bubble icon while talking */
  /* Sized in em of the label font, so it follows AVATAR_SCALE */
  .dots, .mark { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: .2em; font-size: 1.4em;
          line-height: 1; font-style: normal; white-space: nowrap; color: #222; background: #fff; border-radius: .7em; }
  .dots { display: none; padding: 0 .35em .3em; animation: bob .6s ease-in-out infinite alternate; }
  .talking .dots { display: block; }
  /* Vote mark: ?, ✓, or option short name */
  .mark { padding: .15em .35em; }
  .mark:empty { display: none; }
  @keyframes bob { from { transform: translate(-50%, 0); } to { transform: translate(-50%, -30%); } }

  /* Center panel: position and size come from config PANEL */
  .panel { position: absolute; z-index: 150; background: rgba(0,0,0,.75);
           color: #fff; border-radius: .6cqw; font-size: 1.1cqw; display: flex; flex-direction: column; }
  .panel[hidden] { display: none; }
  #casePanel { padding: .8cqw 1.2cqw; overflow: auto; }
  #casePanel h2 { margin: 0 0 .4cqw; font-size: 1.5cqw; }
  #casePanel p, #casePanel ol { margin: .3cqw 0; }
  /* Trial log: translucent white background (opacity from config CHAT_BG_OPACITY) + dark text */
  #chat { background: rgba(255,255,255,var(--chat-bg-op)); backdrop-filter: blur(2px); color: #222; font-size: 1.5cqw; }
  #chat .title { padding: .4cqw 1cqw; background: rgba(215,215,215,.75); color: #111; font-weight: bold; border-radius: .6cqw .6cqw 0 0; }
  #msgs { flex: 1; overflow-y: auto; padding: .3cqw 1cqw; scrollbar-width: none; }
  #msgs::-webkit-scrollbar { display: none; }
  .msg { margin: .5cqw 0; opacity: .7; }
  .msg b { display: block; font-size: 1.2cqw; color: #333; }
  .msg span { display: inline-block; background: rgba(255,255,255,.9); color: #222; padding: .3cqw .8cqw; border-radius: .7cqw; }
  .msg.cur { opacity: 1; }
  .msg.cur span { background: #fff3b0; }
  .msg.sys { opacity: 1; text-align: center; }
  .msg.sys span { background: rgba(190,190,190,.8); color: #222; font-size: 1.3cqw; }
  #chatInput { margin: .5cqw 1cqw 0; font-size: 1.4cqw; padding: .3cqw .5cqw; background: #fff; color: #222; }
  #chatInput::placeholder { color: #666; }
  #notice { margin: .2cqw 1cqw .5cqw; color: #b00000; font-size: 1.2cqw; font-weight: bold; }
  #votePanel { padding: .8cqw 1.2cqw; gap: .5cqw; }
  #votePanel h2 { margin: 0; font-size: 1.5cqw; text-align: center; }
  #votePanel button { font-size: 1.2cqw; padding: .4cqw; cursor: pointer; }
  #votePanel button.chosen { outline: .2cqw solid #ffe08a; }
  .bar-row { display: flex; align-items: center; gap: .6cqw; }
  .bar-row span { width: 8cqw; }
  .bar { flex: 1; height: 1.2cqw; background: rgba(255,255,255,.15); }
  .bar i { display: block; height: 100%; background: #8aa; }
  .bar-row.win { color: #ffe08a; font-weight: bold; }
  .bar-row.win .bar i { background: #ffe08a; }
  #chatInput:disabled { background: #ccc; color: #666; }
  .overlay { position: absolute; inset: 0; z-index: 220; display: flex; align-items: center; justify-content: center;
             background: rgba(0,0,0,.65); transition: opacity .6s; }
  .overlay[hidden] { display: none; }
  .overlay.fade { opacity: 0; }
  .card { width: 30cqw; display: flex; flex-direction: column; gap: .8cqw; padding: 2cqw 3cqw; text-align: center;
          background: #2a2230; color: #fff; border-radius: 1cqw; }
  .card h1 { margin: 0; font-size: 2.6cqw; }
  .card p { margin: 0 0 .6cqw; font-size: 1.4cqw; color: #ccc; }
  .card button { display: flex; justify-content: center; gap: 1cqw; font-size: 1.3cqw; padding: .6cqw; cursor: pointer; }
  .card button:disabled { background: #666; color: #bbb; cursor: default; }
  /* Outro: next-trial teaser card in the translucent white panel tone + one gold accent */
  #endOverlay { flex-direction: column; gap: 1.2cqw; }
  .card.outro { background: rgba(255,255,255,.75); backdrop-filter: blur(2px); color: #222; border-top: .5cqw solid #D4AF37; }
  .card.outro span { align-self: center; padding: .2cqw 1cqw; border-radius: 1cqw; background: #D4AF37; color: #222; font-size: 1.2cqw; font-weight: bold; }
  .card.outro p { margin: 0; color: #444; }
  #endOverlay > button { font-size: 1.3cqw; padding: .6cqw 2cqw; cursor: pointer; }
  /* Rider subtitle (after the verdict text) */
  #sub.rider { color: #ffe08a; font-weight: bold; border: .15cqw solid #ffe08a; }
  /* Gavel strike: short screen shake */
  #stage.gavel { animation: gavel .4s; }
  @keyframes gavel { 20% { translate: -6px 3px; } 40% { translate: 6px -3px; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }
  /* Verdict reactions: cheer = 2 jumps, slump = sink while seated, awkward = small side wiggle */
  .cheer svg { animation: jump .45s ease-out .3s 2; }
  @keyframes jump { 50% { translate: 0 -18%; } }
  .slump svg { animation: slump .6s ease-out forwards; }
  @keyframes slump { to { translate: 0 6%; } }
  .awkward svg { animation: wiggle .25s ease-in-out infinite alternate; }
  @keyframes wiggle { from { translate: -4% 0; } to { translate: 4% 0; } }
  /* Reaction icons drawn with CSS shapes, above the label */
  .react { position: absolute; bottom: 100%; left: 50%; translate: -50% 0; margin-bottom: .4em; }
  .react.star { width: 1.4em; height: 1.4em; background: #ffd34d; animation: pop .4s ease-in-out infinite alternate;
                clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  @keyframes pop { to { scale: 1.2; } }
  .react.sweat { width: .9em; height: .9em; background: #7fc8ff; border: .08em solid #fff; border-radius: 0 50% 50% 50%; rotate: 45deg; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-.4cqw); } 75% { transform: translateX(.4cqw); } }
</style>
</head>
<body>
<div id="bar">
  <button id="next">다음 단계</button>
  <button id="reset">처음부터</button>
  <button id="back" hidden>탑뷰로 복귀</button>
  <button id="filter" hidden>필터 시연</button>
</div>
<div id="stage">
  <div id="court"></div>
  <div id="casePanel" class="panel" hidden></div>
  <div id="votePanel" class="panel" hidden></div>
  <div id="chat" class="panel" hidden>
    <div class="title">재판 기록</div>
    <div id="msgs"></div>
    <input id="chatInput" readonly placeholder="메시지 입력">
    <div id="notice"></div>
  </div>
  <div id="closeup"></div>
  <div id="sub"></div>
  <div id="roleOverlay" class="overlay" hidden>
    <div class="card">
      <h1>연애 재판</h1>
      <p id="caseTitle"></p>
      <button disabled><b>검사</b><small id="pNick"></small></button>
      <button disabled><b>변호인</b><small id="dNick"></small></button>
      <button id="pickJuror"><b>배심원</b><small>6/7 선택됨 · 남은 자리 1</small></button>
    </div>
  </div>
  <div id="endOverlay" class="overlay" hidden>
    <div class="card outro"><span id="outroLabel"></span><h1 id="outroTitle"></h1><p id="outroNote"></p></div>
    <button id="restart">처음부터</button>
  </div>
</div>

<script>
// ===== Config =====
const ASPECT_RATIO = 3 / 2; // bg-top.png is 1536x1024
const BG_TOPVIEW = 'bg-top.png';
const BG_CLOSEUP = 'bg-front.png'; // 3:2, same as the container
// Close-up judge (seated sprite): x center and headTop (% of image), scale × base avatar width (4cqw).
// scale 2.64 keeps the shoulders inside the chair back (x 44~56); headTop 30 puts the forearms/hands on the desk top (~55)
const CLOSEUP_JUDGE = { x: 50, headTop: 30, scale: 2.64 };
// Forearms resting on the desk, in sprite pixels (12 wide): y = forearm row, handX = left x of each 2x2 hand
const CLOSEUP_ARMS = { y: 18, handX: [3, 7] };
// Close-up desk area in the image (%): redrawn above the judge so the desk hides the lower body
const CLOSEUP_DESK_CLIP = { x: 14, y: 55, w: 71, h: 35 };
const WALK_SPEED = 30;   // % moved per second
const MOUTH_MS = 150;
const STEP_MS = 200;     // walk frame interval
const AVATAR_SCALE = 2;  // overall scale for avatars, labels and icons
const STAND_OFFSET = 15; // how far (%) the prosecutor/defender steps toward the center to speak, so they stand in the open space past the vertical desk (width 5.5)
const CHAT_WIDTH_PCT = 40;   // trial log window size (% of container), centered horizontally
const CHAT_HEIGHT_PCT = 20;
const CHAT_TOP_PCT = 21;     // between the judge's head and the back-row juror bubbles
const CHAT_BG_OPACITY = 0.55;
// Coordinates: % of container (avatar feet = seat position)
const DOOR = { x: 50, y: 86 };
const JUDGE_DOOR = { x: 22, y: 25 };
// Judge desk area in the image (%): this part of the background is redrawn above the judge avatar
const DESK_CLIP = { x: 43, y: 19.5, w: 14, h: 8.5 };
// Stage 1 entry order (judge excluded): prosecutor → defender → back row left→right → front row left→right
const ENTRY_ORDER = ['prosecutor', 'defender', 'j1', 'j2', 'j3', 'j4', 'j5', 'j6', 'j7'];
const ENTRY_GAP_MS = 800; // delay between departures
// Views: judge front, prosecutor/defender side (facing center), jurors from behind
const AVATARS = [
  { id: 'judge',      label: '재판장', x: 50, y: 25 }, // below 25 the talk bubble goes off the top edge
  { id: 'prosecutor', label: '검사',   x: 14, y: 52 },
  { id: 'defender',   label: '변호인', x: 86, y: 52 },
  // 3 in the back row, 4 in front: x is staggered so front-row heads fall between back-row ones
  { id: 'j1', label: '배심원 / 별빛', x: 37, y: 66, color: '#d9534f' },
  { id: 'j2', label: '배심원 / 모카', x: 50, y: 66, color: '#a0522d' },
  { id: 'j3', label: '배심원 / 두부', x: 63, y: 66, color: '#e8e2d0' },
  { id: 'j4', label: '배심원 / 감자', x: 31, y: 77, color: '#c9a227' },
  { id: 'j5', label: '배심원 / 하늘', x: 44, y: 77, color: '#4a90d9' },
  { id: 'j6', label: '배심원 / 보리', x: 56, y: 77, color: '#6aa84f' },
  { id: 'j7', label: '배심원 / 토리', x: 69, y: 77, color: '#8e6bbf' },
];
// Props: top-left x, y and w, h (%). Without z, depth comes from the bottom edge (y+h) → in front of a seat it hides the lower body
const PROPS = [
  { cls: '',        x: 43,    y: 21,   w: 14, h: 6, z: 31, plate: '재판장' }, // nameplate only, on the image's judge desk
  { cls: 'chair',   x: 10.5,  y: 46,   w: 4,  h: 7.6, z: 51 },        // prosecutor chair (behind avatar)
  { cls: 'desk v',  x: 19.25, y: 42.7, w: 5.5, h: 18.6, plate: '검사' }, // vertical desk: right in front of avatar (center side)
  { cls: 'chair r', x: 85.5,  y: 46,   w: 4,  h: 7.6, z: 51 },        // defender chair
  { cls: 'desk v r', x: 75.25, y: 42.7, w: 5.5, h: 18.6, plate: '변호인' },
  { cls: 'bench',   x: 32,    y: 64.3, w: 36, h: 6.8 },               // juror back row
  { cls: 'bench',   x: 26,    y: 75.3, w: 48, h: 6.8, z: 99 },        // juror front row (ends above the bottom wall at ~85, below label z 100)
];
// Center panel (case intro, trial log, vote): between the judge bench and back-row juror icons
const PANEL = { x: 32, y: 21, w: 36, h: 20 }; // ends above the back-row juror bubbles (~42)
const ME = 'j1'; // juror played by "me"
const OPTIONS = ['notGuilty', 'demandJustified', 'mutualFault'];
const OPTION_LABELS = { notGuilty: 'A 무죄', demandJustified: 'B 요구 정당', mutualFault: '쌍방 과실' };
const OPTION_SHORT = { notGuilty: 'A', demandJustified: 'B', mutualFault: '쌍방' };
const NPC_VOTES = { j2: 'notGuilty', j3: 'notGuilty', j4: 'demandJustified', j5: 'notGuilty', j6: 'mutualFault', j7: 'notGuilty' };
const NPC_VOTE_MS = 700;
// Verdict text per option. Later replaced by AI-generated text (VERDICT as input)
const JUDGMENT_TEXTS = {
  notGuilty: '주문. 본 법정은 피고인 A가 전 연인과 SNS 연결을 유지한 사실을 인정한다. 그러나 이는 이미 종료된 관계의 형식적 연결에 불과하다고 판단한다. 이에 피고인 A에게 무죄를 선고한다.',
  demandJustified: '주문. 본 법정은 피고인 A가 전 연인과 SNS 연결을 유지한 사실을 인정한다. 현 연인 B가 느낀 불안은 합리적인 범위의 감정으로 판단한다. 이에 B의 정리 요구는 정당하다고 평결한다.',
  mutualFault: '주문. 본 법정은 피고인 A가 전 연인과 SNS 연결을 유지한 사실을 인정한다. 다만 B 또한 대화 대신 일방적 요구로 대응한 점을 참작한다. 이에 본 사건을 쌍방 과실로 평결한다.',
};
// Rider read right after the verdict text, shown as its own highlighted subtitle (placeholder)
const JUDGMENT_RIDERS = {
  notGuilty: '재판부는 다음과 같이 권고한다. 맞팔은 유지하되 알림은 끌 것.',
  demandJustified: '재판부는 다음과 같이 권고한다. 정리한 뒤에는 서운함 대신 식사를 함께할 것.',
  mutualFault: '재판부는 다음과 같이 권고한다. 화해의 식사는 B가 사고, 디저트는 A가 살 것.',
};
const CLOSING_LINE = '이상으로 재판을 마칩니다. 폐정합니다.';
// Outro card (stage 12)
const OUTRO = { label: '다음 재판', title: '읽씹 6시간 사건', note: '곧 개정' };
// Gavel: 3 strikes before the verdict reading, 1 at the closing line. Sound is generated with Web Audio
const GAVEL_ENABLED = true;
const GAVEL_GAP_MS = 450;
// Prosecutor/defender reaction to the verdict (stage 11): cheer | slump | awkward
const REACTIONS = {
  notGuilty:       { defender: 'cheer', prosecutor: 'slump' },
  demandJustified: { prosecutor: 'cheer', defender: 'slump' },
  mutualFault:     { prosecutor: 'awkward', defender: 'awkward' },
};
const REACTION_ICON = { cheer: 'star', slump: 'sweat', awkward: 'sweat' };
const REACTION_MS = 2500;
const CASE = {
  title: '전 애인 팔로우 사건',
  summary: '교제 1년 차 커플. A는 헤어진 지 3년 된 전 연인과 SNS 맞팔을 유지하고 있다. 이를 발견한 B가 정리를 요구했으나 A는 이미 끝난 사이라며 거부했다.',
  issues: ['헤어진 전 연인과 SNS 연결을 유지하는 것은 현 연인에 대한 예의 위반인가?', '연인의 SNS 정리를 요구하는 것은 지나친 간섭인가?'],
  options: OPTIONS,
};
const OPENING = {
  prosecutor: '피고인은 교제 중에도 전 연인과의 연결을 유지해 상대에게 불안을 주었습니다. 이는 배려의 문제라고 주장합니다.',
  defender: '이미 끝난 관계의 SNS 연결은 형식일 뿐입니다. 이를 정리하라는 요구야말로 과한 간섭이라고 주장합니다.',

function spriteSVG(view, pal, mirror) {
  const colors = { h: '#3b2a20', s: '#f1c9a0', E: '#222', p: '#444a55', ...pal };
  const r = (x, y, w, h, fill, cls = '') => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
  let body = '';
  SPRITES[view].forEach((row, y) => [...row].forEach((ch, x) => {
    if (colors[ch]) body += r(x, y, 1, 1, colors[ch]);
  }));
  const p = colors.p;
  // legA standing, legB walk frame 2, legS side sitting (thighs forward); seated: forearms + hands instead of legs
  const { y: ay, handX } = CLOSEUP_ARMS;
  body += view === 'seated'
    ? r(0, ay, 12, 1, colors.c) + handX.map(hx => r(hx, ay, 2, 2, colors.s)).join('')
    : view === 'side'
    ? r(4, 14, 2, 2, p, 'legA') + r(3, 14, 1, 2, p, 'legB') + r(6, 14, 1, 2, p, 'legB') + r(6, 13, 3, 1, p, 'legS') + r(8, 14, 1, 2, p, 'legS')
    : r(2, 15, 3, 1, p, 'legA') + r(7, 15, 3, 1, p, 'legA') + r(3, 15, 2, 1, p, 'legB') + r(8, 15, 2, 1, p, 'legB');
  const m = MOUTH[view];
  if (m) body += r(m[0], m[1], 2, 1, '#7a3b2e', 'closed') + r(m[0], m[1], 2, 2, '#4a1010', 'open');
  return `<svg viewBox="0 0 12 ${view === 'seated' ? ay + 2 : 16}">${mirror ? `<g transform="matrix(-1 0 0 1 12 0)">${body}</g>` : body}</svg>`;
}

function makeAvatar(a, view = a.color ? 'back' : a.id === 'judge' ? 'front' : 'side') {

  el.innerHTML = spriteSVG(view, pal, a.id === 'defender') + `<span class="label">${a.label}<i class="dots">...</i><i class="mark"></i></span>`;
  el.firstChild.style.zIndex = Math.round(a.y); // lower seats are in front
  return el;
}

const timers = new Map();
function loop(key, on, fn, ms) {
  clearInterval(timers.get(key));
  timers.delete(key);
  if (on) timers.set(key, setInterval(fn, ms));
}
function setTalking(el, on) {
  el.classList.remove('talk-open');
  loop(el, on, () => el.classList.toggle('talk-open'), MOUTH_MS);
}

let gen = 0; // bumped by reset; a running stage stops
const wait = ms => new Promise(r => setTimeout(r, ms));

function place(el, p) {
  el.style.transitionDuration = '0ms, 0ms, 0ms';
  el.style.left = p.x + '%';
  el.style.top = p.y + '%';
}
async function walk(el, p, g) {
  const ms = Math.hypot(p.x - parseFloat(el.style.left), p.y - parseFloat(el.style.top)) / WALK_SPEED * 1000;
  el.classList.remove('out', 'sit');
  el.offsetWidth; // start the transition after the position is applied
  el.style.transitionDuration = `${ms}ms, ${ms}ms, 300ms`;
  el.style.left = p.x + '%';
  el.style.top = p.y + '%';
  loop('walk' + el.dataset.id, true, () => el.classList.toggle('step'), STEP_MS);
  await wait(ms);
  if (g !== gen) return;
  loop('walk' + el.dataset.id, false);
  el.classList.remove('step');
}
const sit = (ids, on) => ids.forEach(id => {
  els[id].style.transitionDuration = '0ms, 0ms, 300ms'; // only stand/sit gets a short transition
  els[id].classList.toggle('sit', on);
});
const seatOf = id => AVATARS.find(a => a.id === id);
// Prosecutor/defender: stand, step in front of the desk (center side) to speak, return after
const STAND_DIR = { prosecutor: 1, defender: -1 };
async function stepForth(id, g) {
  const el = els[id];
  if (!STAND_DIR[id] || el.classList.contains('forth')) return;
  el.classList.add('forth');
  sit([id], false);
  await wait(300);
  if (g !== gen) return;
  const a = seatOf(id);
  await walk(el, { x: a.x + STAND_OFFSET * STAND_DIR[id], y: a.y }, g);
}
async function returnSeat(id, g) {
  const el = els[id];
  if (!el.classList.contains('forth')) return;
  el.classList.add('turn');
  await walk(el, seatOf(id), g);
  if (g !== gen) return;
  el.classList.remove('turn', 'forth');
  sit([id], true);
}
const OTHERS = AVATARS.slice(1).map(a => a.id);

function speak(text) {
  if (!('speechSynthesis' in window)) return wait(text.length * 120);
  return new Promise(r => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.onend = u.onerror = r;
    speechSynthesis.speak(u);
  });
}

let audioCtx = null;
function gavelSound() {
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), vol = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + .15);
    vol.gain.setValueAtTime(.9, t);
    vol.gain.exponentialRampToValueAtTime(.001, t + .2);
    osc.connect(vol).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + .2);
  } catch {} // no Web Audio: shake only
}
async function gavel(times, g) {
  if (!GAVEL_ENABLED) return;
  for (let i = 0; i < times; i++) {
    if (g !== gen) return;
    gavelSound();
    stage.classList.remove('gavel');
    stage.offsetWidth; // restart the animation
    stage.classList.add('gavel');
    await wait(GAVEL_GAP_MS);
  }
}

function addMsg(cls, ...children) {
  msgs.querySelectorAll('.cur').forEach(m => m.classList.remove('cur'));
  const m = tag('div');
  m.className = cls;
  m.append(...children);
  msgs.append(m);
  while (msgs.children.length > MAX_MSGS) msgs.firstChild.remove();
  msgs.scrollTop = msgs.scrollHeight;
  return m;
}
async function say(id, text, ms, g) {
  await stepForth(id, g);
  if (g !== gen) return;
  const m = addMsg('msg cur', tag('b', AVATARS.find(a => a.id === id).label), tag('span', text));
  await talk(els[id], ms, g);
  if (g === gen) m.classList.remove('cur');
}
// Speech bubble icon + mouth movement
async function talk(el, ms, g) {
  el.classList.add('talking');
  setTalking(el, true);
  await wait(ms);
  if (g !== gen) return;
  el.classList.remove('talking');
  setTalking(el, false);
}
async function sayAll(lines, g) {
  for (const [i, { id, text }] of lines.entries()) {
    await say(id, text, OPENING_MS, g);
    if (g !== gen) return;
    if (lines[i + 1]?.id !== id) await returnSeat(id, g); // stay standing if the same person speaks next
    if (g !== gen) return;
  }
}

    reactions.forEach(([id, r]) => els[id].classList.remove(r));
    document.querySelectorAll('.react').forEach(el => el.remove());
    sit(reactions.map(([id]) => id), true);
    await wait(400);
    if (g !== gen) return;
    sub.textContent = CLOSING_LINE;
    gavel(1, g);
    await talk(els.judge, 2500, g);
    if (g !== gen) return;
    sit(['judge', ...OTHERS], false);
    await wait(600);
    if (g !== gen) return;
    await walk(els.judge, JUDGE_DOOR, g);
    if (g !== gen) return;
    els.judge.classList.add('out');
  } },
  { name: '', run: async () => { endOverlay.hidden = false; } }, // outro: next trial teaser
];

let step = 0;
async function runStep() {
  const g = gen;
  nextBtn.disabled = true;
  const s = STAGES[step++];
  sub.textContent = s.name;
  await s.run(g);
  if (g !== gen) return;
  if (s.autoNext) return runStep();
  nextBtn.disabled = step >= STAGES.length;
}

// Staged only: always shows the block notice, no real check
filterBtn.onclick = async () => {
  const g = gen;
  filterBtn.disabled = true;
  for (let i = 0; i < 6; i++) { chatInput.value += '●'; await wait(100); }
  if (g !== gen) return;
  notice.textContent = FILTER_NOTICE;
  chatInput.classList.remove('shake');
  chatInput.offsetWidth; // restart the animation
  chatInput.classList.add('shake');
  await wait(1500);
  if (g !== gen) return;
  chatInput.value = notice.textContent = '';
  filterBtn.disabled = false;
};

function reset() {
  gen++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  [...timers.keys()].forEach(k => loop(k, false));
  // Empty courtroom: everyone waits outside the door
  AVATARS.forEach(a => {
    const el = els[a.id];
    el.dataset.id = a.id;
    el.className = `avatar ${el.dataset.view} out`;
    place(el, a.id === 'judge' ? JUDGE_DOOR : DOOR);
  });
  endOverlay.hidden = true;
  setInputEnabled(false);
  closeJudge.className = 'avatar';
  closeup.classList.remove('show');
  backBtn.hidden = casePanel.hidden = chat.hidden = filterBtn.hidden = votePanel.hidden = true;
  document.querySelectorAll('.mark').forEach(m => m.textContent = '');
  document.querySelectorAll('.react').forEach(el => el.remove());
  sub.classList.remove('rider');
  VERDICT = null;
  filterBtn.disabled = false;
  msgs.textContent = chatInput.value = notice.textContent = '';
  step = 0;
  runStep();
}

nextBtn.onclick = runStep;
document.getElementById('reset').onclick = reset;
document.getElementById('restart').onclick = reset;
reset();
</script>
</body>
</html>
